<!-- src/app/features/auth/components/login-form/login-form.component.html -->
<div class="card p-4 shadow-sm">
  <h4 class="mb-3 text-center">Acceso al Laboratorio (JWT)</h4>
  <hr>
  <div *ngIf="validationError" class="alert alert-warning py-2 shadow-sm">
    {{ validationError }}
  </div>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Correo Institucional</label>
      <input type="email" class="form-control" [(ngModel)]="formModel.email" name="email" required [disabled]="isLoading">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="formModel.password" name="password" required [disabled]="isLoading">
    </div>
    <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
      {{ isLoading ? 'Validando Firma Criptográfica...' : 'Iniciar Sesión' }}
    </button>
  </form>
</div>
