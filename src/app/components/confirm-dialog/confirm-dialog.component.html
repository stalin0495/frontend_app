<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="visible">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-semibold">
                    <i class="bi bi-exclamation-triangle-fill text-{{ variante === 'danger' ? 'danger' : 'primary' }} me-2"></i>
                    {{ titulo }}
                </h5>
                <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancelar.emit()"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0 text-secondary">{{ mensaje }}</p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-secondary" (click)="cancelar.emit()">
                    {{ textoCancelar }}
                </button>
                <button type="button" class="btn" [ngClass]="variante === 'danger' ? 'btn-danger' : 'btn-primary'"
                    (click)="confirmar.emit()">
                    {{ textoConfirmar }}
                </button>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop fade show" *ngIf="visible"></div>
