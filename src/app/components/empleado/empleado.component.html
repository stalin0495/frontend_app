<div class="toast-container position-fixed top-0 end-0 p-3">
    <div class="toast align-items-center text-bg-success border-0 show" role="alert" *ngIf="success$ | async as success">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
            </div>
        </div>
    </div>
    <div class="toast align-items-center text-bg-danger border-0 show" role="alert" *ngIf="error$ | async as error">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-exclamation-octagon-fill me-2"></i>{{ error }}
            </div>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-lg-4">
        <app-empleado-form
            [empleado]="empleadoSeleccionado"
            (crear)="onCrear($event)"
            (actualizar)="onActualizar($event)"
            (cancelar)="onCancelar()">
        </app-empleado-form>
    </div>
    <div class="col-lg-8">
        <app-empleado-list
            [empleados]="(empleados$ | async) ?? []"
            (seleccionar)="onSeleccionar($event)"
            (eliminar)="onSolicitarEliminar($event)">
        </app-empleado-list>
    </div>
</div>

<app-confirm-dialog
    [visible]="confirmarEliminarVisible"
    titulo="Eliminar empleado"
    [mensaje]="'¿Estás seguro de que deseas eliminar a ' + (empleadoAEliminar?.nombre ?? '') + '? Esta acción no se puede deshacer.'"
    textoConfirmar="Sí, eliminar"
    variante="danger"
    (confirmar)="onConfirmarEliminar()"
    (cancelar)="onCancelarEliminar()">
</app-confirm-dialog>
