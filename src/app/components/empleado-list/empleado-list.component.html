<div class="card">
    <div class="card-header bg-white d-flex align-items-center justify-content-between">
        <h5 class="mb-0 fw-semibold">
            <i class="bi bi-table me-2 text-primary"></i>Nómina de Empleados
        </h5>
        <span class="badge rounded-pill text-bg-primary">{{ empleados.length }}</span>
    </div>

    <div class="card-body p-0">
        <div class="table-responsive" *ngIf="empleados.length; else vacio">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Empleado</th>
                        <th>Cargo</th>
                        <th>Departamento</th>
                        <th class="text-end">Sueldo</th>
                        <th class="text-end">Operaciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let empleado of empleados; trackBy: trackById">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <span class="avatar-circle">{{ iniciales(empleado.nombre) }}</span>
                                <span class="fw-medium">{{ empleado.nombre }}</span>
                            </div>
                        </td>
                        <td>{{ empleado.cargo }}</td>
                        <td>
                            <span class="badge rounded-pill text-bg-light border">{{ empleado.departamento }}</span>
                        </td>
                        <td class="text-end">{{ empleado.sueldo | currency:'USD':'symbol':'1.2-2' }}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary me-1" title="Editar"
                                (click)="seleccionar.emit(empleado)">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" title="Eliminar"
                                (click)="eliminar.emit(empleado)">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <ng-template #vacio>
            <div class="text-center text-secondary py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                No hay empleados registrados todavía.
            </div>
        </ng-template>
    </div>
</div>
